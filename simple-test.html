<!DOCTYPE html>
<html>
<head>
    <title>Simple Workstation Test</title>
    <style>
        body { margin: 0; background: #050510; }
        canvas { display: block; }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #00f0ff;
            font-family: monospace;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="info">Initializing...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const info = document.getElementById('info');
        let logText = '';

        function log(msg) {
            logText += msg + '<br>';
            info.innerHTML = logText;
            console.log(msg);
        }

        try {
            // Scene
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.008);
            log('✅ Scene created');

            // Camera - same as main app
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 8);
            camera.lookAt(0, 1, 0);
            log('✅ Camera at (0, 3, 8)');

            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x050510, 1);
            document.body.appendChild(renderer.domElement);
            log('✅ Renderer created');

            // Lights - same as main app
            const ambientLight = new THREE.AmbientLight(0x222244, 1.0);
            scene.add(ambientLight);
            log('✅ Ambient light added');

            // Create 4 simple cubes in a circle (like workstations)
            const radius = 6;
            const colors = [0x00f0ff, 0xa000ff, 0x00ff88, 0xff006e];
            const cubes = [];

            for (let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = 1;

                // Simple cube with basic material
                const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                const material = new THREE.MeshStandardMaterial({
                    color: colors[i],
                    emissive: colors[i],
                    emissiveIntensity: 0.5,
                    roughness: 0.3,
                    metalness: 0.7
                });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(x, y, z);
                scene.add(cube);
                cubes.push(cube);

                // Add wireframe
                const edges = new THREE.EdgesGeometry(geometry);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: colors[i] }));
                cube.add(line);

                // Add point light
                const light = new THREE.PointLight(colors[i], 0.8, 12);
                light.position.set(x, y + 1, z);
                scene.add(light);

                log(`✅ Cube ${i+1} at (${x.toFixed(1)}, ${y}, ${z.toFixed(1)})`);
            }

            // Add grid floor
            const gridHelper = new THREE.GridHelper(100, 50, 0x00f0ff, 0x00f0ff);
            gridHelper.position.y = -2;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
            log('✅ Grid added');

            log('<br>📊 Scene stats:');
            log(`  Objects: ${scene.children.length}`);
            log(`  Cubes: ${cubes.length}`);
            log('<br>🎬 Rendering...');

            // Animation
            function animate() {
                requestAnimationFrame(animate);

                const time = Date.now() * 0.001;

                // Rotate cubes
                cubes.forEach((cube, i) => {
                    cube.rotation.x = time * 0.2;
                    cube.rotation.y = time * 0.3;
                    cube.position.y = 1 + Math.sin(time + i) * 0.1;
                });

                renderer.render(scene, camera);
            }

            animate();
            log('<span style="color: #00ff88;">✅✅ SHOULD SEE 4 GLOWING CUBES!</span>');

        } catch (error) {
            log(`<span style="color: #ff0000;">❌ ERROR: ${error.message}</span>`);
            console.error('Full error:', error);
        }
    </script>
</body>
</html>
