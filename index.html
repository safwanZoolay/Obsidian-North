<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian North - Custom Software Development & AI Automation</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-content">
            <div class="nav-logo">OBSIDIAN NORTH</div>
            <div class="nav-links">
                <a href="#how-it-works" class="nav-cta">See Demo</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">
                Engineering teams that<br/>
                move at startup speed.
            </h1>
            <div class="hero-subtitle">
                <p>Enterprise quality.</p>
                <p>Zero compromise.</p>
            </div>
            <div class="scroll-indicator">↓</div>
        </div>
    </section>

    <!-- How It Works - Continuous Scroll Animation -->
    <section class="how-it-works" id="how-it-works">
        <!-- Continuous Build Animation Container -->
        <div class="continuous-build-container">
            <!-- Canvas that transforms -->
            <div class="build-canvas-container">
                <canvas id="build-canvas"></canvas>

                <!-- SVG Layer for vector graphics -->
                <svg id="build-svg" class="build-svg-layer" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- Grid pattern -->
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59, 130, 246, 0.1)" stroke-width="1"/>
                        </pattern>

                        <!-- Glow filter -->
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- Background grid -->
                    <rect id="grid-bg" width="800" height="600" fill="url(#grid)" opacity="0"/>

                    <!-- Wireframe elements (draw in progressively) -->
                    <g id="wireframe-group" opacity="1">
                        <!-- Header -->
                        <rect class="wireframe-box" x="50" y="50" width="700" height="80" rx="8"
                              stroke="rgba(139, 154, 255, 0.4)" stroke-width="1.5" fill="none" stroke-dasharray="1560" stroke-dashoffset="0" filter="url(#glow)"/>

                        <!-- Sidebar -->
                        <rect class="wireframe-box" x="50" y="150" width="200" height="400" rx="8"
                              stroke="rgba(139, 154, 255, 0.4)" stroke-width="1.5" fill="none" stroke-dasharray="1200" stroke-dashoffset="0" filter="url(#glow)"/>

                        <!-- Content card 1 -->
                        <rect class="wireframe-box" x="270" y="150" width="480" height="120" rx="8"
                              stroke="rgba(139, 154, 255, 0.4)" stroke-width="1.5" fill="none" stroke-dasharray="1200" stroke-dashoffset="0" filter="url(#glow)"/>

                        <!-- Content card 2 -->
                        <rect class="wireframe-box" x="270" y="290" width="480" height="120" rx="8"
                              stroke="rgba(139, 154, 255, 0.4)" stroke-width="1.5" fill="none" stroke-dasharray="1200" stroke-dashoffset="0" filter="url(#glow)"/>

                        <!-- Button 1 -->
                        <rect class="wireframe-box" x="270" y="430" width="230" height="60" rx="8"
                              stroke="rgba(139, 154, 255, 0.4)" stroke-width="1.5" fill="none" stroke-dasharray="580" stroke-dashoffset="0" filter="url(#glow)"/>

                        <!-- Button 2 -->
                        <rect class="wireframe-box" x="520" y="430" width="230" height="60" rx="8"
                              stroke="rgba(139, 154, 255, 0.4)" stroke-width="1.5" fill="none" stroke-dasharray="580" stroke-dashoffset="0" filter="url(#glow)"/>

                        <!-- Connection lines -->
                        <line class="wireframe-line" x1="150" y1="150" x2="270" y2="180"
                              stroke="#3b82f6" stroke-width="1" opacity="0.5" stroke-dasharray="200" stroke-dashoffset="200"/>
                        <line class="wireframe-line" x1="150" y1="350" x2="270" y2="320"
                              stroke="#3b82f6" stroke-width="1" opacity="0.5" stroke-dasharray="200" stroke-dashoffset="200"/>
                    </g>

                    <!-- Filled components (fade in after wireframe) -->
                    <g id="components-group" opacity="0">
                        <!-- Header with gradient -->
                        <rect x="50" y="50" width="700" height="80" rx="8" fill="rgba(59, 130, 246, 0.1)" stroke="#3b82f6" stroke-width="1"/>

                        <!-- Sidebar -->
                        <rect x="50" y="150" width="200" height="400" rx="8" fill="rgba(59, 130, 246, 0.05)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>

                        <!-- Content cards -->
                        <rect x="270" y="150" width="480" height="120" rx="8" fill="rgba(139, 92, 246, 0.1)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
                        <rect x="270" y="290" width="480" height="120" rx="8" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>

                        <!-- Buttons -->
                        <rect x="270" y="430" width="230" height="60" rx="8" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
                        <rect x="520" y="430" width="230" height="60" rx="8" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
                    </g>

                    <!-- Final polished app (fade in last) -->
                    <g id="app-group" opacity="0">
                        <!-- Header with window controls -->
                        <rect x="50" y="50" width="700" height="80" rx="8" fill="rgba(10, 10, 15, 0.9)" stroke="rgba(59, 130, 246, 0.5)" stroke-width="2"/>
                        <circle cx="70" cy="90" r="6" fill="#ef4444"/>
                        <circle cx="95" cy="90" r="6" fill="#f59e0b"/>
                        <circle cx="120" cy="90" r="6" fill="#10b981"/>

                        <!-- Sidebar with nav items -->
                        <rect x="50" y="150" width="200" height="400" rx="8" fill="rgba(20, 20, 30, 0.9)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
                        <rect x="65" y="170" width="170" height="40" rx="6" fill="rgba(59, 130, 246, 0.2)"/>
                        <rect x="65" y="225" width="170" height="40" rx="6" fill="rgba(59, 130, 246, 0.05)"/>
                        <rect x="65" y="280" width="170" height="40" rx="6" fill="rgba(59, 130, 246, 0.05)"/>

                        <!-- Content with data -->
                        <rect x="270" y="150" width="480" height="120" rx="8" fill="rgba(30, 30, 45, 0.9)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
                        <rect x="285" y="165" width="450" height="12" rx="4" fill="rgba(139, 92, 246, 0.3)"/>
                        <rect x="285" y="185" width="350" height="8" rx="4" fill="rgba(139, 92, 246, 0.2)"/>
                        <rect x="285" y="200" width="400" height="8" rx="4" fill="rgba(139, 92, 246, 0.2)"/>

                        <rect x="270" y="290" width="480" height="120" rx="8" fill="rgba(30, 30, 45, 0.9)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
                        <rect x="285" y="305" width="450" height="12" rx="4" fill="rgba(6, 182, 212, 0.3)"/>
                        <rect x="285" y="325" width="300" height="8" rx="4" fill="rgba(6, 182, 212, 0.2)"/>
                        <rect x="285" y="340" width="380" height="8" rx="4" fill="rgba(6, 182, 212, 0.2)"/>

                        <!-- Gradient buttons -->
                        <rect x="270" y="430" width="230" height="60" rx="8" fill="url(#button-gradient-1)" filter="url(#glow)"/>
                        <rect x="520" y="430" width="230" height="60" rx="8" fill="url(#button-gradient-2)" filter="url(#glow)"/>

                        <defs>
                            <linearGradient id="button-gradient-1" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="button-gradient-2" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                    </g>
                </svg>

                <!-- Interactive App Layer (becomes functional at 100%) -->
                <div class="interactive-app" id="interactive-app">
                    <!-- Real functional AI assistant -->
                    <div class="app-container">
                        <!-- Header with branding -->
                        <div class="app-header">
                            <div class="app-logo">
                                <div class="logo-icon">⚡</div>
                                <div class="logo-text">
                                    <div class="logo-title">AI Assistant</div>
                                    <div class="logo-subtitle">by Obsidian North</div>
                                </div>
                            </div>
                            <div class="app-status">
                                <span class="status-dot-live"></span>
                                <span class="status-text-live">Online</span>
                            </div>
                        </div>

                        <!-- Chat messages area -->
                        <div class="app-messages" id="app-messages">
                            <div class="welcome-message">
                                <div class="welcome-icon">🎉</div>
                                <h3 class="welcome-title">App Built Successfully!</h3>
                                <p class="welcome-text">
                                    You just watched us build this AI assistant in real-time.
                                    Now it's yours to use. Ask me anything about your project!
                                </p>
                            </div>
                        </div>

                        <!-- Quick actions -->
                        <div class="app-quick-actions">
                            <button class="app-quick-btn" data-app-prompt="What can you build for me?">
                                💡 Services
                            </button>
                            <button class="app-quick-btn" data-app-prompt="How much will my project cost?">
                                💰 Pricing
                            </button>
                            <button class="app-quick-btn" data-app-prompt="Let's schedule a call">
                                📅 Book Call
                            </button>
                        </div>

                        <!-- Chat input -->
                        <div class="app-input-container">
                            <input
                                type="text"
                                id="app-input"
                                class="app-input"
                                placeholder="Ask about your project..."
                                autocomplete="off"
                            />
                            <button id="app-send" class="app-send-btn">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M2 10L18 2L11 18L9 11L2 10Z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </section>

    <script src="js/app.js"></script>
</body>
</html>
