<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test - Single Workstation</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #050510; }
        #canvas { width: 100%; height: 100vh; }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #00f0ff;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">Loading...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const info = document.getElementById('info');

        try {
            // Scene
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            info.innerHTML = 'Scene created<br>';

            // Camera
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, 0);
            info.innerHTML += 'Camera created<br>';

            // Renderer
            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            info.innerHTML += 'Renderer created<br>';

            // Simple cube (not using custom shaders)
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                wireframe: true
            });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            info.innerHTML += 'Cube added<br>';

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x00f0ff, 1, 100);
            pointLight.position.set(2, 3, 4);
            scene.add(pointLight);
            info.innerHTML += 'Lights added<br>';

            info.innerHTML += `<br>Scene children: ${scene.children.length}<br>`;
            info.innerHTML += `Camera position: ${camera.position.x}, ${camera.position.y}, ${camera.position.z}<br>`;

            // Animation
            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }

            animate();
            info.innerHTML += '<br><span style="color:#00ff88">✅ Rendering!</span>';

        } catch (error) {
            info.innerHTML += `<br><span style="color:#ff0000">❌ Error: ${error.message}</span>`;
            console.error(error);
        }
    </script>
</body>
</html>
